executor: cluster-generic
jobs: 1000
cores: 10000
latency-wait: 60
printshellcmds: true

software-deployment-method:
  - apptainer

default-resources:
  - queue=UI-GPU
  - gpus=3

cluster-generic-submit-cmd: "qsub -terse -cwd -j y -o snakemakeLogs -q {resources.queue} -pe smp {threads} -l ngpus={resources.gpus}"