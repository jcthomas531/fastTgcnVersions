executor: cluster-generic
jobs: 25
cores: 128
latency-wait: 60
printshellcmds: true

software-deployment-method:
  - apptainer

default-resources:
  - queue=BIOSTAT
  - gpus=0

#a fake resource that will be included in quarto rules to stop them running parallel
resources:
  - quarto=1

cluster-generic-submit-cmd: "qsub -terse -cwd -j y -o snakemakeLogs -q {resources.queue} -pe smp {threads} -l ngpus={resources.gpus}"